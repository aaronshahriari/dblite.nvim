name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-linux
          - os: ubuntu-24.04-arm
            target: aarch64-linux
          - os: macos-latest
            target: aarch64-macos

    steps:
      - uses: actions/checkout@v4

      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build native binary
        run: mvn -q clean package -Pnative

      - name: Smoke test SQLite
        shell: bash
        run: |
          db="$RUNNER_TEMP/dblite-smoke.sqlite"
          DB_URL="jdbc:sqlite:$db" bin/dblite <<<'CREATE TABLE smoke (answer INTEGER)'
          DB_URL="jdbc:sqlite:$db" bin/dblite <<<'INSERT INTO smoke VALUES (42)'
          output=$(DB_URL="jdbc:sqlite:$db" bin/dblite <<<'SELECT answer FROM smoke')
          [[ "$output" == *'"answer": 42'* ]]

      - name: Stage release asset
        run: cp bin/dblite dblite-${{ matrix.target }}

      - uses: softprops/action-gh-release@v2
        with:
          files: dblite-${{ matrix.target }}
